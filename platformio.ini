[platformio]
src_dir = ProjectThing

[env:TTGO_TWatch]
board = ttgo-t-watch
platform = espressif32 @ ^6.0.1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps = 
    https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library
    BluetoothSerial